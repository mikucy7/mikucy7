name: Generate profile summary cards

# 每天自动刷新统计卡片，卡片 SVG 生成到 profile-summary-cards/ 目录
# 好处：图片存在自己仓库里，不依赖 github-readme-stats 等第三方服务
#（该服务公共实例经常被暂停/限流，导致资料页卡片加载失败）

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 0 点（北京时间 8 点）自动更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github
          AUTO_PUSH: false

      # 去掉卡片外边框（背景矩形的 stroke）
      - name: Remove card borders
        run: |
          find profile-summary-card-output -name "*.svg" \
            -exec sed -i 's/\(<rect x="1" y="1" rx="5" ry="5"[^>]*\) stroke="[^"]*" stroke-width="1"/\1/g' {} +

      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --cached --quiet || git commit -m "Update profile summary cards [skip ci]"
          git push
